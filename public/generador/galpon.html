<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

</style></head><body>
<title>Generador Remeco</title>
<meta name="claude:viewport-fit-sides" content="cover">


<style>
/* Visor a pantalla completa: escena 3D detrás, ficha técnica y controles flotando como un rótulo de plano */
:root{
  --bg:#dfe5e8; --panel:rgba(250,251,250,.92); --fg:#1d2427; --muted:#5a666c; --line:#c4ccd0;
  --accent:#c2551b; --accent-fg:#fff; --chip:#eef1f2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191c; --panel:rgba(24,30,33,.9); --fg:#e7ecee; --muted:#9aa7ad; --line:#334047;
  --accent:#e8763a; --accent-fg:#14191c; --chip:#222b2f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191c; --panel:rgba(24,30,33,.9); --fg:#e7ecee; --muted:#9aa7ad; --line:#334047;
  --accent:#e8763a; --accent-fg:#14191c; --chip:#222b2f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#cielo,#scene{position:fixed;inset:0;display:block;width:100%;height:100%}
#scene{touch-action:none}
.hud{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));
  width:min(330px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:6px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:14px 16px;display:grid;gap:12px;max-height:calc(100% - 140px);overflow:auto}
.brand{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 30px/1 var(--display);margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(760px,calc(100% - 32px))}
.grp{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px;gap:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button{font:600 13px/1 var(--body);color:var(--fg);background:transparent;border:0;border-radius:4px;padding:9px 11px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--chip)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--muted)}
.toggle-info{display:none}
@media (max-width:620px){
  .hud{padding:10px 12px;gap:8px} h1{font-size:24px}
  .hud.min dl,.hud.min .hint{display:none}
  .toggle-info{display:inline-block;padding:6px 8px;font-size:12px;border:1px solid var(--line)}
  button{padding:8px 9px;font-size:12px}
}
</style>

<canvas id="cielo" aria-hidden="true"></canvas>
<canvas id="scene" aria-label="Modelo 3D del galpón"></canvas>

<section class="hud" id="hud">
  <div>
    <div class="brand">Metalúrgica Remeco · Generador</div>
    <h1 id="tit">Galpón</h1>
    <div class="sub" id="sub"></div>
  </div>
  <form id="f" class="frm">
    <label>Ancho (m)<input name="ancho" type="number" step="0.01" min="3"></label>
    <label>Largo (m)<input name="largo" type="number" step="0.01" min="3"></label>
    <label>Alto (m)<input name="alto" type="number" step="0.01" min="2"></label>
    <label>Aguas<select name="aguas"><option value="2">Dos aguas</option><option value="1">Un agua</option></select></label>
    <label>Pendiente (%)<input name="pend" type="number" step="1" min="3" max="40"></label>
    <label>Estructura<select name="sistema"><option value="torsionado">Hierro torsionado</option><option value="perfil">Perfil U y ángulo</option><option value="alma">Alma llena</option></select></label>
    <label>Pórticos cada (m, máx.)<input name="sep" type="number" step="0.1" min="2"></label>
    <label>Portón (ancho x alto, 0 = sin)<input name="porton" type="text"></label>
    <label>Chapa desde (m del piso)<input name="cerr" type="number" step="0.1" min="0"></label>
    <label>Color de chapa<select name="color"><option value="cincalum">Cincalum</option><option value="gris">Gris</option><option value="azul">Azul</option><option value="verde">Verde</option><option value="rojo">Rojo</option><option value="blanco">Blanco</option><option value="negro">Negro</option></select></label>
    <button type="submit" class="go">Dibujar</button>
  </form>
  <div class="row2"><button type="button" id="bFotos">Descargar fotos</button><button type="button" id="bCroquis">Ver croquis</button></div>
  <button class="toggle-info" id="toggleInfo" type="button" aria-expanded="true">Ocultar ficha</button>
</section>
<div id="croq" hidden>
  <div class="cbar"><b>Croquis</b><span class="sp"></span><button type="button" id="bPrint">Imprimir / guardar PDF</button><button type="button" id="bVolver">Volver al 3D</button></div>
  <div id="hojas"></div>
</div>

<nav class="bar" aria-label="Controles del modelo">
  <div class="grp" role="group" aria-label="Chapas">
    <button type="button" id="m-full" aria-pressed="true">Completo</button>
    <button type="button" id="m-xray" aria-pressed="false">Transparente</button>
    <button type="button" id="m-frame" aria-pressed="false">Estructura</button>
  </div>
  <div class="grp" role="group" aria-label="Vista">
    <button type="button" data-view="iso">3/4</button>
    <button type="button" data-view="frente">Frente</button>
    <button type="button" data-view="lateral">Lateral</button>
    <button type="button" data-view="arriba">Arriba</button>
    <button type="button" data-view="esquina">Detalle</button>
  </div>
  <div class="grp"><button type="button" id="porton" aria-pressed="false">Abrir portón</button></div>
</nav>

<script>
// ======= Parámetros: vienen del link (?ancho=12&largo=8...) o del formulario =======
(function(){
  const D={ancho:12,largo:8,alto:4.5,aguas:2,pend:10,sistema:'torsionado',sep:5,porton:'4x4',cerr:0,color:'cincalum'};
  const q=new URLSearchParams(location.search); const P={};
  for(const k in D){ const v=q.get(k); P[k]= v===null||v==='' ? D[k] : (typeof D[k]==='number'? parseFloat(String(v).replace(',','.')) : v); }
  if(!(P.ancho>0))P.ancho=D.ancho; if(!(P.largo>0))P.largo=D.largo; if(!(P.alto>0))P.alto=D.alto; if(!(P.pend>0))P.pend=D.pend; if(!(P.sep>0))P.sep=D.sep;
  const pt=String(P.porton).toLowerCase().replace(',','.').split(/[x×*]/).map(parseFloat);
  const pw=pt[0]>0?Math.min(pt[0],P.ancho-1):0, ph=pw?Math.min(pt[1]>0?pt[1]:Math.min(4,P.alto-0.3),P.alto-0.2):0;
  // Remeco: en dos aguas la pendiente que se pide (ej. 10 %) es del ancho total, o sea el doble por faldón (20 %)
  const UNO=+P.aguas===1, p=P.pend/100*(UNO?1:2), CAIDA=UNO?P.ancho*p:P.ancho/2*p;
  const n=Math.max(2,Math.ceil(P.largo/P.sep)+1), por=[]; for(let i=0;i<n;i++) por.push(+(P.largo*i/(n-1)).toFixed(3));
  const sec={torsionado:{d:.3,b:.22,col:[22,30],cab:[22,30],txt:'Hierro torsionado Ø16 + Ø10/Ø8',perfil:false},
             perfil:{d:.35,b:.18,col:[18,35],cab:[20,45],txt:'Perfil U 1/8" + ángulo 1 1/4"x1/8"',perfil:true},
             alma:{d:.30,b:.15,col:[15,30],cab:[15,30],txt:'Alma llena (perfil W)',perfil:true}}[P.sistema]||null;
  const S=sec||{d:.3,b:.22,col:[22,30],cab:[22,30],txt:'Hierro torsionado',perfil:false};
  const filas=(h0,h1)=>{const r=[];for(let y=h0+.35;y<=h1-.1+1e-6;y+=1.0)r.push(+y.toFixed(2));return r;};
  const colores={cincalum:0xffffff,gris:0x9aa1a7,azul:0x3c6aa6,verde:0x4f8a5c,rojo:0xb0403a,blanco:0xf5f7f8,negro:0x3a3d40};
  window.REMECO_P=P;
  window.REMECO_G={L:P.ancho,LG:P.largo,H:P.alto,CAIDA,UNO,PERFIL:S.perfil,d:S.d,b:S.b,porticos:por,porton:{w:pw,h:ph},paso:.25,portonLat:null,
    ZB:P.cerr,YLAT:filas(P.cerr,P.alto),YCARA:filas(P.cerr,P.alto+CAIDA),ENTRE:true,CANALETA:null,COLOR:colores[P.color]||0xffffff};
  window.REMECO_C={ancho:P.ancho,largo:P.largo,alto:P.alto,aguas:+P.aguas,pendiente:p,porticos:n,porton:pw?[pw,ph]:null,colSec:S.col,cabSec:S.cab,
    correasCara:filas(P.cerr,P.alto).map(y=>y*100),correasLat:filas(P.cerr,P.alto).map(y=>y*100),sistema:S.txt,tipo:P.sistema,
    chapaTxt:(P.color==='cincalum'?'cincalum':'chapa color '+P.color)+' n°25',cerrTxt:P.cerr>=P.alto?'sin chapa lateral':P.cerr>0?('desde '+String(P.cerr).replace('.',',')+' m'):'hasta el piso'};
})();
</script>
<script>var module={exports:{}};
// Hojas de plano estilo Remeco (rótulo con logo, medidas en cm) — SVG
const f = n => (Math.round(n * 100) / 100).toString().replace('.', ',');
const FONT = 'Inter,DejaVu Sans,sans-serif';

function base(VW, VH) { // VW x VH = área de dibujo en px del SVG
  return {
    s: [],
    line(x1, y1, x2, y2, w = 1.2, dash = '', col = '#111') { this.s.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`); },
    poly(pts, w = 1.2, fill = 'none', dash = '') { this.s.push(`<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${fill}" stroke="#111" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`); },
    rect(x, y, w, h, sw = 1.2, fill = 'none', dash = '') { this.s.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#111" stroke-width="${sw}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`); },
    text(x, y, t, size = 15, anchor = 'middle', rot = 0, weight = 400) { this.s.push(`<text x="${x}" y="${y}" font-family="${FONT}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" ${rot ? `transform="rotate(${rot} ${x} ${y})"` : ''} fill="#111">${t}</text>`); },
    // cota horizontal: entre x1 y x2 a la altura y (px), líneas de extensión desde yRef
    ch(x1, x2, y, yRef, txt) {
      this.line(x1, yRef, x1, y + (y > yRef ? 6 : -6), .6); this.line(x2, yRef, x2, y + (y > yRef ? 6 : -6), .6);
      this.s.push(`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#111" stroke-width=".8" marker-start="url(#ar)" marker-end="url(#ar)"/>`);
      this.text((x1 + x2) / 2, y - 5, txt, 15);
    },
    cv(y1, y2, x, xRef, txt) {
      this.line(xRef, y1, x + (x > xRef ? 6 : -6), y1, .6); this.line(xRef, y2, x + (x > xRef ? 6 : -6), y2, .6);
      this.s.push(`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#111" stroke-width=".8" marker-start="url(#ar)" marker-end="url(#ar)"/>`);
      this.text(x - 6, (y1 + y2) / 2, txt, 15, 'middle', -90);
    },
    out() { return this.s.join(''); }
  };
}

function hoja(g, titulo, nota, escala, n, N, dibujo, logo, fecha) {
  const W = 1188, H = 840; // A4/A3 apaisado en px (proporción 1,414)
  const desc = `${g.aguas === 1 ? 'Un agua' : 'Dos aguas'} - ${g.sistema} - ${g.porticos} pórticos a ${f(g.largo / (g.porticos - 1))} m - correas 100x50x2 galv. - ${g.chapaTxt} ${g.cerrTxt || "hasta el piso"}${g.porton && g.porton[0] ? ` - portón ${f(g.porton[0])}x${f(g.porton[1])} doble hoja (opcional)` : ''}`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,2.5 L10,5 L0,7.5 z" fill="#111"/></marker></defs>
  <rect x="14" y="14" width="${W - 28}" height="${H - 28}" fill="#fff" stroke="#111" stroke-width="1.4"/>
  ${nota ? `<text x="${W / 2}" y="70" font-family="${FONT}" font-size="20" text-anchor="middle">${nota}</text>` : ''}
  <g>${dibujo}</g>
  <line x1="14" y1="${H - 112}" x2="${W - 14}" y2="${H - 112}" stroke="#111" stroke-width="1.4"/>
  ${[370, 820, 1035].map(x => `<line x1="${x}" y1="${H - 112}" x2="${x}" y2="${H - 14}" stroke="#111" stroke-width="1"/>`).join('')}
  <image href="${logo}" x="26" y="${H - 104}" width="200" height="82" preserveAspectRatio="xMidYMid meet"/>
  <text x="236" y="${H - 80}" font-family="${FONT}" font-size="10.5">Colonia Menonita</text>
  <text x="236" y="${H - 64}" font-family="${FONT}" font-size="10.5">La Pampa</text>
  <text x="232" y="${H - 36}" font-family="${FONT}" font-size="8.4">metalurgicaremeco1@gmail.com</text>
  <text x="384" y="${H - 82}" font-family="${FONT}" font-size="13" font-weight="700">Galpón ${f(g.ancho)} × ${f(g.largo)} × ${f(g.alto)} m</text>
  <text x="384" y="${H - 56}" font-family="${FONT}" font-size="14">${titulo}</text>
  <text x="384" y="${H - 34}" font-family="${FONT}" font-size="9">${desc.split(' - ').slice(0,3).join(' - ')}</text><text x="384" y="${H - 20}" font-family="${FONT}" font-size="9">${desc.split(' - ').slice(3).join(' - ')}</text>
  <text x="834" y="${H - 82}" font-family="${FONT}" font-size="12">${escala}</text>
  <text x="834" y="${H - 56}" font-family="${FONT}" font-size="12">Medidas en cm</text>
  <text x="834" y="${H - 30}" font-family="${FONT}" font-size="12">Fecha: ${fecha}</text>
  <text x="1050" y="${H - 78}" font-family="${FONT}" font-size="12">Hoja</text>
  <text x="1050" y="${H - 44}" font-family="${FONT}" font-size="16" font-weight="700">${n} de ${N}</text>
  </svg>`;
}

// geometría en cm → px (escala k px/cm, origen en el piso izquierdo)
function geo(g) {
  const W = g.ancho * 100, L = g.largo * 100, H = g.alto * 100, R = g.aguas === 1 ? H + W * g.pendiente : H + (W / 2) * g.pendiente;
  return { W, L, H, R, dc: g.colSec[1], bc: g.colSec[0], dv: g.cabSec[1] };
}

function portico(g) {
  const { W, H, R, dc, dv } = geo(g); const k = 0.62, ox = 594 - W * k / 2, oy = 610;
  const X = x => ox + x * k, Y = y => oy - y * k, d = base();
  const top = x => g.aguas === 1 ? H + g.pendiente * x : H + g.pendiente * Math.min(x, W - x);
  // columnas
  for (const x0 of [0, W - dc]) d.rect(X(x0), Y(top(x0 === 0 ? 0 : W)), dc * k, (top(x0 === 0 ? 0 : W)) * k, 1.3);
  // cabreada: cordón superior y cordón inferior paralelos
  for (const s of [1, -1]) {
    const xa = s > 0 ? 0 : W, xm = W / 2;
    d.line(X(xa), Y(top(xa)), X(xm), Y(R), 1.4);
    d.line(X(s > 0 ? dc : W - dc), Y(top(s > 0 ? dc : W - dc) - dv), X(xm), Y(R - dv), 1.4);
    // correas cada ~1 m
    const n = Math.ceil((W / 2) / 100);
    for (let i = 0; i <= n; i++) { const x = s > 0 ? (W / 2) * i / n : W - (W / 2) * i / n; d.rect(X(x) - 3, Y(top(x)) - 7, 6, 6, .6); }
    // reticulado en N cada 45 cm (perfil U); en torsionado no se muestra el paso
    if (g.tipo !== 'torsionado') {
    const x0 = s > 0 ? dc : W - dc; const m = Math.round(Math.abs(xm - x0) / 45);
    for (let i = 0; i <= m; i++) { const x = x0 + (xm - x0) * i / m; d.line(X(x), Y(top(x)), X(x), Y(top(x) - dv), .5);
      if (i < m) { const x2 = x0 + (xm - x0) * (i + 1) / m; d.line(X(x), Y(top(x) - dv), X(x2), Y(top(x2)), .5); } }
    }
  }
  d.line(X(W / 2), Y(R), X(W / 2), Y(R - dv), .8);
  d.line(X(-60), Y(0), X(W + 60), Y(0), 1);
  // cotas
  d.ch(X(0), X(W), Y(0) + 40, Y(0), f(W));
  d.cv(Y(0), Y(H), X(0) - 40, X(0), f(H));
  d.cv(Y(0), Y(R), X(W) + 46, X(W), f(R));
  d.cv(Y(H), Y(R), X(W) + 16, X(W / 2), f(R - H));
  d.text(X(W / 4) - 10, Y(top(W / 4)) - 26, `${f(Math.hypot(W / 2, R - H))}`, 16, 'middle', -Math.atan(g.pendiente) * 180 / Math.PI);
  d.ch(X(0), X(dc), Y(0) + 16, Y(0), f(dc));
  d.text(X(W * 0.72), Y(top(W * 0.72) - dv) + 30, (g.tipo === 'torsionado' ? `Cabreada ${f(g.cabSec[0])}×${f(dv)} · hierro torsionado Ø16, reticulado Ø10/Ø8` : `Cabreada ${f(dv)} cm · U 200×70×1/8" + ángulo 1 1/4"×1/8"`), 13);
  d.text(X(dc) + 14, Y(H * 0.45), (g.tipo === 'torsionado' ? `Columna ${f(g.colSec[0])}×${f(dc)} · hierro torsionado` : `Columna ${f(g.colSec[0])}×${f(dc)} · U 180×70×1/8"`), 13, 'start');
  return d.out();
}

function frente(g) {
  const { W, H, R, bc } = geo(g); const k = 0.62, ox = 594 - W * k / 2, oy = 610;
  const X = x => ox + x * k, Y = y => oy - y * k, d = base();
  const top = x => g.aguas === 1 ? H + g.pendiente * x : H + g.pendiente * Math.min(x, W - x);
  d.poly([[X(0), Y(0)], [X(W), Y(0)], [X(W), Y(top(W))], [X(W / 2), Y(top(W / 2))], [X(0), Y(H)]], 1.4);
  // chapa 10 cm sobre el faldón
  d.poly([[X(0), Y(H + 10)], [X(W / 2), Y(top(W / 2) + 10)], [X(W), Y(top(W) + 10)]], .6, 'none', '4 3');
  const cols = [0, W - bc]; let pw = 0, ph = 0, px0 = 0;
  if (g.porton) { pw = g.porton[0] * 100; ph = g.porton[1] * 100; px0 = W / 2 - pw / 2; cols.push(px0 - bc, px0 + pw); }
  cols.sort((a, b) => a - b);
  for (const x of cols) d.rect(X(x), Y(top(x + bc / 2)), bc * k, top(x + bc / 2) * k, 1);
  // correas de frente entre columnas

    camera.position.lerpVectors(anim.p0,anim.p1,e); controls.target.lerpVectors(anim.t0,anim.t1,e); if(anim.t>=1) anim=null; }

  // para las cotas sobre la foto: punto 3D -> posición en la imagen (0..1)
  // encuadre automático: cámara desde una esquina, a la distancia justa para que el galpón llene la foto
  encuadrar(dx,dz,elev,margen){ const m=margen||1; const t=new THREE.Vector3(G.L/2,Yr*0.42,G.LG/2);
    const d=new THREE.Vector3(dx,0,dz).normalize(); const pts=[]; for(const x of [-m,G.L+m]) for(const z of [-m,G.LG+m]) for(const y of [0,Yr]) pts.push(new THREE.Vector3(x,y,z));
    const cabe=D=>{ camera.position.set(t.x+d.x*D*Math.cos(elev), t.y+D*Math.sin(elev), t.z+d.z*D*Math.cos(elev)); camera.lookAt(t); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
      let a=1e9,b=-1e9,c=1e9,e=-1e9; for(const q of pts){ const v=q.clone().project(camera); a=Math.min(a,v.x); b=Math.max(b,v.x); c=Math.min(c,v.y); e=Math.max(e,v.y);} return (b-a)<=1.76 && (e-c)<=1.5; };
    let lo=2, hi=400; for(let i=0;i<40;i++){ const mid=(lo+hi)/2; if(cabe(mid)) hi=mid; else lo=mid; }
    cabe(hi); controls.target.copy(t); controls.update(); },
  proyectar(x,y,z){ const v=new THREE.Vector3(x,y,z).project(camera); return [(v.x+1)/2,(1-v.y)/2]; }, Ye, Yr};

  const hoy=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const nc=Math.ceil((C.aguas===1?C.ancho:C.ancho/2))+1;
  const H=[['Frente',PLANO.frente(C),''],['Pórtico medio',PLANO.portico(C),`${nc} correas de techo 100x50x2 por faldón a 1 m`],['Vista lateral',PLANO.lateral(C),''],['Planta',PLANO.planta(C),'']];
  document.getElementById('hojas').innerHTML=H.map((h,i)=>`<div class="hoja">${PLANO.hoja(C,h[0],h[2],'Escala aprox. 1:50',i+1,H.length,h[1],LOGO,hoy)}</div>`).join('');
  const cq=document.getElementById('croq');
  document.getElementById('bCroquis').onclick=()=>{cq.hidden=false;};
  document.getElementById('bVolver').onclick=()=>{cq.hidden=true;};
  document.getElementById('bPrint').onclick=()=>window.print();
  // fotos: cielo + escena en un JPG
  function foto(nombre){ galpon.render(); const a=document.getElementById('cielo'), b=document.getElementById('scene');
    const c=document.createElement('canvas'); c.width=b.width; c.height=b.height; const g=c.getContext('2d');
    g.drawImage(a,0,0,c.width,c.height); g.drawImage(b,0,0);
    const l=document.createElement('a'); l.download=nombre+'.jpg'; l.href=c.toDataURL('image/jpeg',.9); document.body.appendChild(l); l.click(); l.remove(); }
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  window.remecoFotos=async function(bajar=true){
    const base=`galpon-${m(C.ancho)}x${m(C.largo)}`, out=[];
    const tomas=[['foto1','full',false,'1-frente'],['foto2','full',false,'2-esquina'],['frente','full',true,'3-porton-abierto'],['iso','frame',false,'4-estructura'],['interior','full',false,'5-interior']];
    for(const [v,mo,ab,n] of tomas){ if(ab&&!C.porton) continue; galpon.setModo(mo); galpon.setVista(v,true); galpon.abrir(ab,true); await wait(250); if(bajar) foto(base+'-'+n); out.push(n); }
    galpon.setModo('full'); galpon.abrir(false,true); galpon.setVista('iso',true); return out; };
  document.getElementById('bFotos').onclick=()=>remecoFotos(true);
  // para la calculadora: devuelve las fotos y los croquis como imágenes (data URL), sin descargar nada
  function fotoURL(){ galpon.render(); const a=document.getElementById('cielo'), b=document.getElementById('scene');
    const c=document.createElement('canvas'); c.width=b.width; c.height=b.height; const g=c.getContext('2d');
    g.drawImage(a,0,0,c.width,c.height); g.drawImage(b,0,0); return {src:c.toDataURL('image/jpeg',.88),w:c.width,h:c.height}; }
  function svgAJpg(svg,W,H){ return new Promise((ok,mal)=>{ const s=svg.replace('style="width:100%;height:100%;display:block"',`width="${W}" height="${H}"`);
    const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
      g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.drawImage(im,0,0,W,H); ok({src:c.toDataURL('image/jpeg',.9),w:W,h:H}); };
    im.onerror=mal; im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s); }); }
  // cotas (medidas) dibujadas sobre una foto: ancho, largo, alto y cumbrera
  function cotas(img){ return new Promise(ok=>{ const im=new Image(); im.onload=()=>{
    const W=img.w, Hh=img.h, c=document.createElement('canvas'); c.width=W; c.height=Hh; const g=c.getContext('2d'); g.drawImage(im,0,0);
    const s=W/1200, pr=(x,y,z)=>{const q=galpon.proyectar(x,y,z); return [q[0]*W,q[1]*Hh];};
    const o=Math.max(.9,C.ancho*.06);
    function cota(a,b,txt,abajo){ const A=pr(...a), B=pr(...b); let ang=Math.atan2(B[1]-A[1],B[0]-A[0]);
      const flecha=(P,d)=>{ g.beginPath(); g.moveTo(P[0],P[1]); g.lineTo(P[0]-d*22*s*Math.cos(ang-0.35),P[1]-d*22*s*Math.sin(ang-0.35)); g.lineTo(P[0]-d*22*s*Math.cos(ang+0.35),P[1]-d*22*s*Math.sin(ang+0.35)); g.closePath(); g.fill(); };
      g.lineCap='round'; g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=8*s; g.beginPath(); g.moveTo(...A); g.lineTo(...B); g.stroke();
      g.strokeStyle='#1f2b45'; g.fillStyle='#1f2b45'; g.lineWidth=3.2*s; g.beginPath(); g.moveTo(...A); g.lineTo(...B); g.stroke(); flecha(B,1); flecha(A,-1);
      // texto sobre la línea, en el mismo sentido (siempre legible, nunca cabeza abajo)
      let t=ang; if(t>Math.PI/2) t-=Math.PI; if(t<-Math.PI/2) t+=Math.PI; if(Math.abs(Math.abs(t)-Math.PI/2)<0.25) t=-Math.PI/2;
      const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2; g.save(); g.translate(mx,my); g.rotate(t);
      g.font=`800 ${Math.round(44*s)}px Arial, Helvetica, sans-serif`; g.textAlign='center'; g.textBaseline=abajo?'top':'bottom'; const ty=abajo?10*s:-10*s;
      g.lineJoin='round'; g.strokeStyle='rgba(255,255,255,.95)'; g.lineWidth=9*s; g.strokeText(txt,0,ty); g.fillStyle='#1f2b45'; g.fillText(txt,0,ty); g.restore(); }
    const Ye=galpon.Ye, Yr=galpon.Yr;
    cota([0,0,-o],[C.ancho,0,-o],m(C.ancho)+' m',true);
    cota([-o,0,0],[-o,0,C.largo],m(C.largo)+' m',true);
    cota([-o,0,-o],[-o,Ye,-o],m(C.alto)+' m');
    if(C.aguas!==1) cota([C.ancho/2,0,-.25],[C.ancho/2,Yr,-.25],m(C.alto+C.ancho/2*C.pendiente)+' m');
    else cota([C.ancho,0,-.25],[C.ancho,Yr,-.25],m(C.alto+C.ancho*C.pendiente)+' m',true);
    ok({src:c.toDataURL('image/jpeg',.9),w:W,h:Hh}); }; im.src=img.src; }); }
  window.remecoImagenes=async function(){
    const tomas=[['foto1','full',false,'Vista frente'],['foto2','full',false,'Vista esquina'],['frente','full',true,'Portón abierto'],['iso','frame',false,'Estructura'],['interior','full',false,'Interior']];
    galpon.setModo('full'); galpon.abrir(false,true); galpon.encuadrar(-0.62,-1,0.2,Math.max(.9,C.ancho*.06)+.6); await wait(250);
    const principal={titulo:'Medidas',...await cotas(fotoURL())};
    const fotos=[];
    for(const [v,mo,ab,t] of tomas){ if(ab&&!C.porton) continue; galpon.setModo(mo); galpon.abrir(ab,true);
      if(v==='foto2') galpon.encuadrar(1,-0.85,0.16,.3); else if(v==='foto1') galpon.encuadrar(-0.62,-1,0.16,.3); else if(v==='iso') galpon.encuadrar(-0.7,-0.9,0.42,.3); else galpon.setVista(v,true);
      await wait(250); fotos.push({titulo:t,...fotoURL()}); }
    galpon.setModo('full'); galpon.abrir(false,true); galpon.setVista('iso',true);
    const croquis=[]; for(let i=0;i<H.length;i++){ const h=H[i]; croquis.push({titulo:h[0],...await svgAJpg(PLANO.hoja(C,h[0],h[2],'Escala aprox. 1:50',i+1,H.length,h[1],LOGO,hoy),2376,1680)}); }
    return {principal,fotos,croquis}; };
  window.remecoListo=true;
  // desde la calculadora dentro de un iframe: postMessage({remeco:{ancho:12,largo:8,...}})
  window.addEventListener('message',e=>{ const d=e.data&&e.data.remeco; if(!d) return; const q=new URLSearchParams(location.search); for(const k in d) q.set(k,d[k]); location.search=q.toString(); });
})();
</script>
